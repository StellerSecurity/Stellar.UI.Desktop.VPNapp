name: Windows actual Rust source coverage
on:
  workflow_dispatch:
  push:
    branches: ['stellar/codeql-vendor-workspace-20261115']
    paths: ['.github/workflows/windows-app-metadata.yml', 'scripts/windows-app-metadata.py', 'scripts/windows-codeql-source.ps1', 'native/codeql/windows-app-metadata-plan.json', 'native/codeql/windows-app-source-inputs.json']
permissions: {}
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Prepare reviewed sources and verify offline analysis graph
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import hashlib, os, pathlib, re, subprocess, sys, tempfile, urllib.request
          commit = os.environ['SOURCE_COMMIT']
          if not re.fullmatch('[a-f0-9]{40}', commit):
              raise ValueError('exact first-party commit required')
          files = {
              'tests/windows-analysis-paths.test.py': ('7b36dbaeb72f3e33b84d948235ac4015d8ee964a3ed555a5a53ae99047c6408f', 524288),
              'scripts/stage-reviewed-rust-queries.py': ('cc7561508d8fddf5c5f8cb15961b1a5878591c267f9a626607f0031881298134', 2097152),
              'native/codeql/rust-query-source-inputs.json': ('fe87f7bca97ceed18061370646aeb9ab1db649b56c11e6dc30ea2c4b0dfe9a4f', 2097152),
              'scripts/windows-codeql-toolchain.ps1': ('583313a8db4d59507ce06580e80a72304a0f66fa40f80b9e671ca8644383cdde', 524288),
              'native/codeql/rust-sysroot-source-inputs.json': ('002ff08b64041193a2991dfd6438263645bdb4c07b7ae6e96520f614ad722ef8', 2097152),
              'scripts/stage-reviewed-rust-sysroot.py': ('39cee2a4fd131e0f8910fe53d15f34b5df1791eb9e02b735e31be39a4516c9af', 2097152),
              'scripts/windows-app-metadata.py': ('0ce59cfa6447f4331d5bdb88fdea7cbf36a3744d441f4fc4e61bf816bbc6be43', 524288),
              'scripts/windows-codeql-source.ps1': ('c8c0db3048059567f0678949530923079b00aa617bc0c93baa5c20ef34f6d766', 524288),
              'scripts/windows-codeql-probe.py': ('f3a792800c5cb12c913e847c93bd72cb59921a38c56710e59451b33ce1282212', 524288),
              'native/codeql/windows-codeql-probe-plan.json': ('ec6220c54a86ab0139682b09b213d77e455564a8a8d414acd96628a7bf37be14', 524288),
              'native/codeql/windows-app-source-inputs.json': ('d867ca1414b3d6db0e809d0fe3ba0b2c8291955dde4e17122862a20bcbe8764e', 524288),
              'native/codeql/windows-app-metadata-plan.json': ('511ae7ac981fc083ad53c24230dd4c5fe57c53c48787fb0951c9befd1eaf74f7', 524288),
          }
          with tempfile.TemporaryDirectory(prefix='stellar-app-metadata-') as folder:
              root = pathlib.Path(folder)
              for name, (expected, limit) in files.items():
                  url = 'https://raw.githubusercontent.com/StellerSecurity/Stellar.UI.Desktop.VPNapp/' + commit + '/' + name
                  with urllib.request.urlopen(url, timeout=30) as response:
                      raw = response.read(limit + 1)
                      if response.geturl() != url or len(raw) > limit or hashlib.sha256(raw).hexdigest() != expected:
                          raise ValueError('reviewed analysis helper drift')
                  (root / pathlib.Path(name).name).write_bytes(raw)
              subprocess.run([sys.executable, str(root / 'windows-analysis-paths.test.py')], check=True, timeout=30)
              subprocess.run([sys.executable, str(root / 'windows-app-metadata.py')], check=True, timeout=2400)
