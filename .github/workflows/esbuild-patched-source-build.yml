name: Reviewed esbuild source rebuild

on:
  workflow_dispatch:
  push:
    branches: ['stellar/codeql-vendor-workspace-20261115']
    paths:
      - '.github/workflows/esbuild-patched-source-build.yml'
      - 'scripts/build-reviewed-esbuild.py'
      - 'native/codeql/esbuild-rebuild-plan.json'
      - 'scripts/probe-reviewed-esbuild-api.py'

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Build only the reviewed isolated source inputs
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import hashlib, os, pathlib, re, subprocess, sys, tempfile, urllib.request
          commit = os.environ['SOURCE_COMMIT']
          if not re.fullmatch('[a-f0-9]{40}', commit):
              raise ValueError('exact first-party commit required')
          files = {
              'scripts/build-reviewed-esbuild.py': ('17c198feff6beba845277c09fbc6d0590acd0f9e956cf50cc8d8c72be277e2b2', 65536),
              'native/codeql/esbuild-rebuild-plan.json': ('52be2c76a2a72e93797a31ee522d599485a33e379f538c49f7900cb6427f9632', 65536),
              'scripts/probe-reviewed-esbuild-api.py': ('bcf34788397d22f081967bcbed46896d960e48de8fe78f8f1acfb61e626662ff', 65536),
              'scripts/linux-npm-backport-probe.py': ('aaccee6c9eec318efdd5c3cebf1d8986f6758eeb3990dc171760f07c0a820556', 65536),
              'scripts/patch-reviewed-npm-tool.py': ('b256f3844d01e55da6ac8fd38f48985ec6dae7bb9ecb1953d53ddc603d964fa3', 65536),
              'scripts/stage-reviewed-esbuild-fork.py': ('de9268edf1dc7266fc66bf653d07b43134926d62981bdff0763e0b5e489bf8bf', 65536),
              'scripts/reviewed-esbuild-binary.cjs': ('f5c8a3aa6b92772a5d1d21eebf2e5796fc27571c12df252e12bd751cb5238ce7', 65536),
              'native/esbuild-source-fork/package-template.json': ('e5fc4c4c3e6ec0f59df33a2187fcfc43042685e5224903356208fac4d9be1711', 65536),
              'native/esbuild-source-fork/binary-review.json': ('6e3b77348fd273ec25b783187fc4d0c92ce2392eb334a0f95b4bbff0fd615f93', 65536),
              'native/esbuild-source-fork/stellar-patch.json': ('67c0da9a3f17b0a5bfae58918a04264db0ba167e8ff8786fab177aa10f5a240c', 65536),
          }
          with tempfile.TemporaryDirectory(prefix='stellar-esbuild-review-') as folder:
              root = pathlib.Path(folder)
              for name, (expected, limit) in files.items():
                  url = 'https://raw.githubusercontent.com/StellerSecurity/Stellar.UI.Desktop.VPNapp/' + commit + '/' + name
                  with urllib.request.urlopen(url, timeout=30) as response:
                      if response.geturl() != url:
                          raise ValueError('unexpected first-party response')
                      raw = response.read(limit + 1)
                  if len(raw) > limit or hashlib.sha256(raw).hexdigest() != expected:
                      raise ValueError('first-party build guard drift')
                  (root / pathlib.Path(name).name).write_bytes(raw)
              subprocess.run([sys.executable, str(root / 'build-reviewed-esbuild.py'), '--export-reviewed-runtimes', str(root / 'generated-runtimes')], check=True, timeout=840)
