name: Windows Rust macro server static metadata
on:
  workflow_dispatch:
  push:
    branches: ['stellar/codeql-vendor-workspace-20261115']
    paths: ['.github/workflows/windows-rust-helper-static.yml', 'scripts/windows-rust-helper-static.py']
permissions: {}
jobs:
  inventory:
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - name: Read installed macro-server bytes without launching it
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import hashlib, os, pathlib, re, subprocess, sys, tempfile, urllib.request
          commit = os.environ['SOURCE_COMMIT']
          if not re.fullmatch('[a-f0-9]{40}', commit):
              raise ValueError('exact first-party commit required')
          url = 'https://raw.githubusercontent.com/StellerSecurity/Stellar.UI.Desktop.VPNapp/' + commit + '/scripts/windows-rust-helper-static.py'
          with urllib.request.urlopen(url, timeout=30) as response:
              raw = response.read(32769)
              if response.geturl() != url or len(raw) > 32768 or hashlib.sha256(raw).hexdigest() != '8e8291a742f767bc9ba0e1271ed8081ae759625f8f28f714dee103e00379bbb4':
                  raise ValueError('first-party static reader drift')
          with tempfile.TemporaryDirectory(prefix='stellar-rust-helper-static-') as folder:
              script = pathlib.Path(folder) / 'reader.py'
              script.write_bytes(raw)
              subprocess.run([sys.executable, str(script)], check=True, timeout=60)
