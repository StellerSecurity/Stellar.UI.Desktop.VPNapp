name: Rust system build metadata
on:
  workflow_dispatch:
  push:
    branches: ['stellar/codeql-vendor-workspace-20261115']
    paths: ['.github/workflows/rust-system-build-inventory.yml', 'scripts/rust-system-build-inventory.py']
permissions: {}
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read relevant public build metadata only
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import hashlib, os, pathlib, re, subprocess, sys, tempfile, urllib.request
          commit = os.environ['SOURCE_COMMIT']
          if not re.fullmatch('[a-f0-9]{40}', commit):
              raise ValueError('exact source commit required')
          url = 'https://raw.githubusercontent.com/StellerSecurity/Stellar.UI.Desktop.VPNapp/' + commit + '/scripts/rust-system-build-inventory.py'
          with urllib.request.urlopen(url, timeout=30) as response:
              raw = response.read(32769)
              if response.geturl() != url or len(raw) > 32768 or hashlib.sha256(raw).hexdigest() != '99c4d831e8aa5ab9d4239b267ed1a3d9878f7c33832580c4f327a59a02a77817':
                  raise ValueError('first-party metadata reader drift')
          with tempfile.TemporaryDirectory(prefix='stellar-system-metadata-') as folder:
              script = pathlib.Path(folder) / 'inventory.py'
              script.write_bytes(raw)
              subprocess.run([sys.executable, str(script)], check=True, timeout=90)
