name: Windows native compile only

on:
  workflow_dispatch:
  push:
    branches: ['stellar/windows-hosted-inventory']
    paths:
      - '.github/workflows/windows-native-compile.yml'

permissions: {}

concurrency:
  group: windows-native-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: github.repository == 'StellerSecurity/Stellar.UI.Desktop.VPNapp'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Fetch exact first-party source and verify hashes
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$') { throw 'Exact source commit required.' }
          $files = @(
            @{ path = 'native/windows/native-tests.cpp'; sha256 = '67ab64ac6f96ebd1d4188bc482778306855d9742e1cfe7ff5f6136ab766b0b3c' },
            @{ path = 'native/windows/common.hpp'; sha256 = '92937e9fe7461ef33fa5e4f7ace913ddf3ec21ef1254ae30902c1167e1a35c2a' },
            @{ path = 'native/windows/firewall.hpp'; sha256 = '1e979937afd0eec239215ef0bb7a938549070ded169679945f68ab944b66fb3a' },
            @{ path = 'native/windows/lifecycle.hpp'; sha256 = '6c364913604a97d0836303b5417986446c28dea0095794c547d2dec4c98d360c' },
            @{ path = 'native/windows/bridge.cpp'; sha256 = '0a4cb46afa0a00e1d1843950d44a5e48aceb45cbc577567601f2a6cca0b2d80e' },
            @{ path = 'native/windows/service.cpp'; sha256 = 'b0df74c2011eeee7e62195739f32a051cfa08751a28f3c4a431c76a64cb62510' },
            @{ path = 'native/windows/bridge-link-test.cpp'; sha256 = 'd7ef6820a2804c12bbda5900037f99c14a9a5ca6311d3bc9e234019c4983fed2' },
            @{ path = 'scripts/windows-native-compile.ps1'; sha256 = 'fac3bf54b9811213535de4ce236213058eb974e4bab8b089ea14e390e3dd11a0' },
            @{ path = 'native/windows/compile-approval.json'; sha256 = 'd044068f202e74210cd5e5062a21f3ee7011dd01709327e0456e488853a6eaa4' }
          )
          $root = Join-Path $env:RUNNER_TEMP 'stellar-native-source'
          [IO.Directory]::CreateDirectory($root) | Out-Null
          foreach ($entry in $files) {
              $destination = Join-Path $root $entry.path
              [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($destination)) | Out-Null
              $url = 'https://raw.githubusercontent.com/StellerSecurity/Stellar.UI.Desktop.VPNapp/' + $env:SOURCE_COMMIT + '/' + $entry.path
              $request = [Net.HttpWebRequest]::Create($url)
              $request.AllowAutoRedirect = $false
              $request.Timeout = 30000
              $response = $request.GetResponse()
              try {
                  $output = [IO.File]::Create($destination)
                  try { $response.GetResponseStream().CopyTo($output) } finally { $output.Dispose() }
              } finally { $response.Dispose() }
              if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256) { throw 'First-party source hash mismatch.' }
          }
          $reviewDirectory = Join-Path $root '.security-review'
          [IO.Directory]::CreateDirectory($reviewDirectory) | Out-Null
          [IO.File]::Copy((Join-Path $root 'native/windows/compile-approval.json'), (Join-Path $reviewDirectory 'windows-native-compile-approval.json'))
          "STELLAR_NATIVE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile native code and run synthetic first-party tests only
        run: |
          & (Join-Path $env:STELLAR_NATIVE_ROOT 'scripts/windows-native-compile.ps1') -RunSyntheticTests
      - name: Verify explicit Cargo output directory and reject output reuse
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:STELLAR_NATIVE_ROOT 'scripts/windows-native-compile.ps1'
          $output = Join-Path $env:RUNNER_TEMP 'stellar-cargo-native-output'
          & $script -OutputDirectory $output
          if (-not (Test-Path -LiteralPath (Join-Path $output 'stellar_windows.lib'))) { throw 'Cargo bridge archive is missing.' }
          $rejected = $false
          try { & $script -OutputDirectory $output } catch {
              if ($_.Exception.Message -ne 'Build output must be a fresh directory.') { throw }
              $rejected = $true
          }
          if (-not $rejected) { throw 'Existing build output was unexpectedly reused.' }
