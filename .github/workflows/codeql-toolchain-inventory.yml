name: CodeQL toolchain static inventory

on:
  workflow_dispatch:
  push:
    branches: ['stellar/codeql-vendor-workspace-20261115']
    paths:
      - '.github/workflows/codeql-toolchain-inventory.yml'
      - 'scripts/codeql-toolchain-inventory.py'

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect preinstalled files without executing tools
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import hashlib, os, re, urllib.request
          commit = os.environ['SOURCE_COMMIT']
          if not re.fullmatch('[a-f0-9]{40}', commit):
              raise ValueError('exact first-party commit required')
          url = 'https://raw.githubusercontent.com/StellerSecurity/Stellar.UI.Desktop.VPNapp/' + commit + '/scripts/codeql-toolchain-inventory.py'
          with urllib.request.urlopen(url, timeout=30) as response:
              source = response.read(65537)
          if len(source) > 65536 or hashlib.sha256(source).hexdigest() != 'b3ced67180dc9b3fa4489ae791b353f815da3b585e06443992c1603cecab4981':
              raise ValueError('first-party inventory script changed')
          exec(compile(source, 'reviewed-first-party-inventory.py', 'exec'), {'__name__': '__main__'})
