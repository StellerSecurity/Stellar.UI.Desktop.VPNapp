name: Rust CodeQL layout and body probe

on:
  workflow_dispatch:
  push:
    branches: ['stellar/codeql-vendor-workspace-20261115']
    paths:
      - '.github/workflows/codeql-layout-probe.yml'
      - 'scripts/codeql-layout-probe.py'
      - 'native/codeql/layout-probe-plan.json'

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify the isolated first-party layout probe
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          EXECUTE_USER_APPROVED_LAYOUT_PROBE: 'true'
        shell: python
        run: |
          import hashlib, os, pathlib, re, subprocess, sys, tempfile, urllib.request
          commit = os.environ['SOURCE_COMMIT']
          if not re.fullmatch('[a-f0-9]{40}', commit):
              raise ValueError('exact first-party commit required')
          files = {
              'scripts/codeql-layout-probe.py': ('7a14561d1a88b96d84cb9ae8b9f5328ff7ef32e048745c1d5b534a3c91a3907a', 65536),
              'scripts/codeql-rust-probe.py': ('51992ff68b94b0fd1f45b8187e93753a149cabfdadb429ae301a3968ecc3062e', 65536),
              'native/codeql/layout-probe-plan.json': ('a2287743da0ab8b39a4b3fad9a3e85019085042f851f669ed56ca077e681685e', 65536),
              'native/codeql/runtime-review.json': ('c8965ee984ca699e87fead31b46c68330c645759f85bd63711c77ebe64eaf0db', 262144),
          }
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          with tempfile.TemporaryDirectory(prefix='stellar-layout-preflight-') as folder:
              root = pathlib.Path(folder)
              for name, (expected, limit) in files.items():
                  url = 'https://raw.githubusercontent.com/StellerSecurity/Stellar.UI.Desktop.VPNapp/' + commit + '/' + name
                  with opener.open(url, timeout=30) as response:
                      if response.geturl() != url:
                          raise ValueError('unexpected source response')
                      raw = response.read(limit + 1)
                  if len(raw) > limit or hashlib.sha256(raw).hexdigest() != expected:
                      raise ValueError('first-party layout helper drift')
                  (root / pathlib.Path(name).name).write_bytes(raw)
              command = [sys.executable, str(root / 'codeql-layout-probe.py'),
                         '--plan', str(root / 'layout-probe-plan.json')]
              if os.environ['EXECUTE_USER_APPROVED_LAYOUT_PROBE'] == 'true':
                  command += ['--approved-plan-sha256', 'a2287743da0ab8b39a4b3fad9a3e85019085042f851f669ed56ca077e681685e']
              elif os.environ['EXECUTE_USER_APPROVED_LAYOUT_PROBE'] != 'false':
                  raise ValueError('unknown layout execution mode')
              subprocess.run(command, check=True, timeout=540)
