name: Offline Rollup artifact provenance verification
on:
  workflow_dispatch:
  push:
    branches: ['stellar/codeql-vendor-workspace-20261115']
    paths: ['.github/workflows/linux-rollup-provenance.yml', 'scripts/linux-rollup-provenance.py', 'scripts/verify-rollup-provenance.cjs', 'scripts/prepare-sigstore-public-metadata.py']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify public origin without target code or network-enabled Node
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import hashlib, os, pathlib, re, subprocess, sys, tempfile, urllib.request
          commit = os.environ['SOURCE_COMMIT']
          if not re.fullmatch('[a-f0-9]{40}', commit):
              raise ValueError('immutable first-party source required')
          files = {
              'scripts/linux-rollup-provenance.py': '969f3981b86758ceab9797fea2393a623961c023841c9f48a6a24ab23ec20168',
              'scripts/verify-rollup-provenance.cjs': 'ebf5be8bb7d2a120f666a1b531e1acb32b19af14b3fc9a0bb1ccc235a050b324',
              'scripts/prepare-sigstore-public-metadata.py': '6dc8d71dfc753e0f94c8a49da969662a5df283b7d00ee1d0d4c1f87f0f43c3c6',
              'scripts/linux-npm-backport-probe.py': 'aaccee6c9eec318efdd5c3cebf1d8986f6758eeb3990dc171760f07c0a820556',
              'scripts/patch-reviewed-npm-tool.py': 'b256f3844d01e55da6ac8fd38f48985ec6dae7bb9ecb1953d53ddc603d964fa3',
          }
          with tempfile.TemporaryDirectory(prefix='stellar-public-provenance-') as directory:
              root = pathlib.Path(directory)
              for name, expected in files.items():
                  url = 'https://raw.githubusercontent.com/StellerSecurity/Stellar.UI.Desktop.VPNapp/' + commit + '/' + name
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = response.read(262145)
                      if response.geturl() != url or len(data) > 262144 or hashlib.sha256(data).hexdigest() != expected:
                          raise ValueError('reviewed first-party helper drift')
                  (root / pathlib.Path(name).name).write_bytes(data)
              subprocess.run([sys.executable, str(root / 'linux-rollup-provenance.py')], check=True, timeout=240)
