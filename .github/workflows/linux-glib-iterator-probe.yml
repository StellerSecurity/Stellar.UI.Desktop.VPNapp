name: Native GLib production iterator regressions
on:
  workflow_dispatch:
  push:
    branches: ['stellar/codeql-vendor-workspace-20261115']
    paths: ['.github/workflows/linux-glib-iterator-probe.yml', 'scripts/linux-glib-iterator-probe.py', 'native/codeql/glib-iterator-native-plan.json', 'native/codeql/glib-iterator-harness.rs']
permissions: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify exact native inputs and run isolated iterator regressions
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import hashlib, os, pathlib, re, subprocess, sys, tempfile, urllib.request
          commit = os.environ['SOURCE_COMMIT']
          if not re.fullmatch('[a-f0-9]{40}', commit):
              raise ValueError('exact source commit required')
          files = {
              'scripts/linux-glib-iterator-probe.py': ('0c62fb7b046714b7fa428570b64bdae5ea05f0a9b338432281bd06cd5f6bd672', 'linux-glib-iterator-probe.py'),
              'native/codeql/glib-iterator-native-plan.json': ('e8501f389adfcf38909fc4a63debb62f48d5d08a54ea5124295bc2c914843356', 'glib-iterator-native-plan.json'),
              'native/codeql/glib-iterator-harness.rs': ('6c745efc31aae83fcbcc8658f21bbec420a2bfc770a7bf8c37882ea21ba45aa1', 'glib-iterator-harness.rs'),
              'native/codeql/runtime-review.json': ('c8965ee984ca699e87fead31b46c68330c645759f85bd63711c77ebe64eaf0db', 'runtime-review.json'),
              'vendor/glib-0.18.5/src/variant_iter.rs': ('a0f5ee8acb8faa089bcdfbc9a57372609fce7654026ccef7d9a224d05a654ccc', 'variant_iter.rs'),
          }
          with tempfile.TemporaryDirectory(prefix='stellar-glib-native-') as directory:
              root = pathlib.Path(directory)
              for name, (expected, target) in files.items():
                  url = 'https://raw.githubusercontent.com/StellerSecurity/Stellar.UI.Desktop.VPNapp/' + commit + '/' + name
                  with urllib.request.urlopen(url, timeout=30) as response:
                      raw = response.read(262145)
                      if response.geturl() != url or len(raw) > 262144 or hashlib.sha256(raw).hexdigest() != expected:
                          raise ValueError('first-party source or reviewed profile drift')
                  (root / target).write_bytes(raw)
              subprocess.run([sys.executable, str(root / 'linux-glib-iterator-probe.py')], check=True, timeout=420)
