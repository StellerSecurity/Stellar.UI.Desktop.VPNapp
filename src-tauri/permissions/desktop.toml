[[permission]]
identifier = "allow-desktop-preview"
description = "Allows local preview session, settings and simulated connection commands."
commands.allow = ["bootstrap", "select_location", "connect_preview", "disconnect_preview", "save_settings", "accept_account_session", "logout", "complete_onboarding", "open_stellar_link", "show_main", "show_locations", "hide_tray", "quit_preview"]
