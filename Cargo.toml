[workspace]
members = ["src-tauri", "crates/stellar-core"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
